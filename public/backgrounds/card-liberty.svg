<svg width="400" height="250" viewBox="0 0 400 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="libertyStarGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 12 L22 18 L28 18 L23 22 L25 28 L20 24 L15 28 L17 22 L12 18 L18 18 Z" fill="none" stroke="#FFFFFF" stroke-width="0.4" opacity="0.25"/>
      <circle cx="20" cy="20" r="16" fill="none" stroke="#FFFFFF" stroke-width="0.3" stroke-dasharray="2 3" opacity="0.2"/>
    </pattern>
    <radialGradient id="libertyGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </radialGradient>
  </defs>
  <rect width="400" height="250" fill="url(#libertyStarGrid)"/>
