  <circle cx="200" cy="125" r="65" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.3"/>
  <circle cx="200" cy="125" r="45" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.25"/>
  <!-- Laurel Wreath Crest Accents -->
  <path d="M140 125 C140 165 170 190 200 190 C230 190 260 165 260 125" fill="none" stroke="#FFFFFF" stroke-width="1.0" opacity="0.35"/>
  <path d="M145 125 C145 158 172 180 200 180 C228 180 255 158 255 125" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-dasharray="3 3" opacity="0.25"/>
</svg>
